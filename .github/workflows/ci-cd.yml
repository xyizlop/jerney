name: CI/CD

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  lint:
    # continue-on-error: true
    strategy:
      matrix:
        component:
        - frontend
        - backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: "${{ matrix.component }}/package-lock.json"
      - run: npm ci
        working-directory: ${{ matrix.component }}
      - name: Lint
        run: npm run lint
        working-directory: ${{ matrix.component }}