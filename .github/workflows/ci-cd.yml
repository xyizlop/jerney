name: CI/CD

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

concurrency:
  group: ${{ github.ref_name }}-${{ github.workflow }}
  cancel-in-progress: true

# -------------------------------------------
# Stage 1: Linting
# -------------------------------------------

jobs:
  lint:
    strategy:
      matrix:
        component:
        - frontend
        - backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: "${{ matrix.component }}/package-lock.json"
      - run: npm ci
        working-directory: ${{ matrix.component }}
      - run: npm run lint
        working-directory: ${{ matrix.component }}

# -------------------------------------------
# Stage 2: Audit or SCA
# -------------------------------------------

  audit:
    needs: lint
    strategy:
      matrix:
        component:
        - frontend
        - backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: "${{ matrix.component }}/package-lock.json"
      - run: npm ci
        working-directory: ${{ matrix.component }}
      - run: npm audit --audit-level=high || true # true set becasue this project intentially containes vulnerabilities which will break (fail) CI
        working-directory: ${{ matrix.component }}

# -------------------------------------------
# Stage 3: Checkov
# -------------------------------------------

  pac:
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Checkov on k8s/
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: k8s/
          framework: kubernetes
          soft_fail: true  # Soft fail for K8s (some checks may not apply)
          output_format: cli,sarif
          output_file_path: console,results.sarif
        
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v2 
        # Results are generated only on a success or failure
        # this is required since GitHub by default won't run the next step
        # when the previous one has failed. Security checks that do not pass will 'fail'.
        # An alternative is to add `continue-on-error: true` to the previous step
        # Or 'soft_fail: true' to checkov.
        if: success() || failure()
        with:
          sarif_file: results.sarif