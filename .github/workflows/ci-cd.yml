name: CI/CD

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

concurrency:
  group: ${{ github.ref_name }}-${{ github.workflow }}
  cancel-in-progress: true

# -------------------------------------------
# Stage 1: Linting
# -------------------------------------------

jobs:
  lint:
    strategy:
      matrix:
        component:
        - frontend
        - backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: "${{ matrix.component }}/package-lock.json"
      - run: npm ci
        working-directory: ${{ matrix.component }}
      - run: npm run lint
        working-directory: ${{ matrix.component }}

# -------------------------------------------
# Stage 2: Audit or SCA
# -------------------------------------------

  audit:
    needs: lint
    strategy:
      matrix:
        component:
        - frontend
        - backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: echo "${{ github.ref_name }}-${{ github.workflow }}" # debug
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: "${{ matrix.component }}/package-lock.json"
      - run: npm ci
        working-directory: ${{ matrix.component }}
      - run: npm audit --audit-level=high || true # true set becasue this project intentially containes vulnerabilities which will break (fail) CI
        working-directory: ${{ matrix.component }}