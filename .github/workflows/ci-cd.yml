name: CI/CD

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

concurrency:
  group: ${{ github.ref_name }}-${{ github.workflow }}
  cancel-in-progress: true

# -------------------------------------------
# Stage 1: Linting
# -------------------------------------------

jobs:
  lint:
    continue-on-error: true
    strategy:
      matrix:
        component:
        - frontend
        - backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: "${{ matrix.component }}/package-lock.json"
      - run: npm ci
        working-directory: ${{ matrix.component }}
      - run: npm run lint
        working-directory: ${{ matrix.component }}

# -------------------------------------------
# Stage 2: Audit or SCA of frontend/backend
# -------------------------------------------

  audit:
    needs: lint
    continue-on-error: true
    strategy:
      matrix:
        component:
        - frontend
        - backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: "${{ matrix.component }}/package-lock.json"
      - run: npm ci
        working-directory: ${{ matrix.component }}
      - run: npm audit --audit-level=high || true # true set becasue this project intentially containes vulnerabilities which will break (fail) CI
        working-directory: ${{ matrix.component }}

# -------------------------------------------
# Stage 3: Checkov k8s manifests
# -------------------------------------------

  pac:
    needs: audit
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Run Checkov on k8s/
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: k8s/
          framework: kubernetes
          soft_fail: true  # Soft fail for K8s (some checks may not apply)
          output_format: cli,sarif
          output_file_path: console,results.sarif
        
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        # Results are generated only on a success or failure
        # this is required since GitHub by default won't run the next step
        # when the previous one has failed. Security checks that do not pass will 'fail'.
        # An alternative is to add `continue-on-error: true` to the previous step
        # Or 'soft_fail: true' to checkov.
        if: success() || failure()
        with:
          sarif_file: results.sarif

# -------------------------------------------
# Stage 5: Dockerfile Linting
# -------------------------------------------

  docker-lint:
    continue-on-error: true
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
        - frontend
        - backend
    steps:
    - uses: actions/checkout@v7
    - uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: ${{ matrix.component }}/Dockerfile

# -------------------------------------------
# Stage 5: Scan Docker Image
# -------------------------------------------
  docker-scan:
    continue-on-error: true
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
        - frontend
        - backend
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker Image for Scan
        run: docker build -t ${{ matrix.component }}:scanme ${{ matrix.component }}/
        shell: bash
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ matrix.component }}:scanme'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

# -------------------------------------------
# Stage 6: Build and Push to Docker Hub
# -------------------------------------------

  docker-push:
    needs:
    - docker-lint
    - docker-scan
    continue-on-error: true
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
        - repo: jerney-frontend
          component: frontend
        - repo: jerney-backend
          component: backend

    steps:
    - uses: actions/checkout@v7
    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.repo }}
        tags: |
          # 1. latest if default branch
          type=raw,value=latest,enable={{is_default_branch}}
          
          # 2. Matches GitHub commit SHA (use format=short for an 8-character SHA)
          type=sha,format=long
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        context: ./${{ matrix.component }}
        file: ./${{ matrix.component }}/Dockerfile

# -------------------------------------------
# Stage 7: Update HELM Values for ArgoCD
# -------------------------------------------

  write-helm-values: # argocd will pick up then
    needs: docker-push
    permissions:
      contents: write # to commit changes
    name: Write HELM Chart values.yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master # required for git-auto-commit-action because this is trigged by tag push and not branch push
      - name: Update tag in values.yaml for frontend/backend
        run: yq -i '.frontend.tag = "sha-${{ github.sha }}"' k8s/EKS/helm/jerney/values.yaml && yq -i '.backend.tag = "sha-${{ github.sha }}"' k8s/EKS/helm/jerney/values.yaml
      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          file_pattern: "helm/go-web-app-chart/values.yaml"
          commit_message: Update helm chart tag for frontend/backend