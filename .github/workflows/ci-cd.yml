name: CI/CD

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

# -------------------------------------------
# Stage 1: Linting
# -------------------------------------------

jobs:
  lint:
    strategy:
      matrix:
        component:
        - frontend
        - backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: "${{ matrix.component }}/package-lock.json"
      - run: npm ci
        working-directory: ${{ matrix.component }}
      - run: npm run lint
        working-directory: ${{ matrix.component }}

# -------------------------------------------
# Stage 2: Audit or SCA
# -------------------------------------------

  audit:
    strategy:
      matrix:
        component:
        - frontend
        - backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: "${{ matrix.component }}/package-lock.json"
      - run: npm ci
        working-directory: ${{ matrix.component }}
      - run: npm audit --audit-level=high
        working-directory: ${{ matrix.component }}