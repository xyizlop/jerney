# --------------------------------------------------
# ArgoCD Configuration (Controller Required)
# --------------------------------------------------
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: aws-alb-gateway-class
  namespace: jerney
spec:
  controllerName: gateway.k8s.aws/alb
---
apiVersion: gateway.k8s.aws/v1
kind: LoadBalancerConfiguration
metadata:
  name: internal-lb # for argocd
  namespace: jerney
spec:
  scheme: internal
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal-alb-gateway
  namespace: jerney
spec:
  gatewayClassName: aws-alb-gateway-class
  infrastructure:
    parametersRef:
      kind: LoadBalancerConfiguration
      name: internal-lb
      group: gateway.k8s.aws
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
---
# required because ALB by default creates http target group but argocd is https
apiVersion: gateway.k8s.aws/v1
kind: TargetGroupConfiguration
metadata:
  name: argocd-server-tg
  # https://kubernetes-sigs.github.io/aws-load-balancer-controller/latest/guide/gateway/customization states
  # only one TargetGroupConfiguration CRD can be declared per service, and it must reside within the same namespace as the service it configures.
  namespace: argocd
spec:
  targetReference:
    group: ""
    kind: Service
    name: argocd-server # matches the below HTTPRoute service and must reside on same ns as of this TargetGroupConfiguration
  defaultConfiguration:
    protocol: HTTPS
    targetType: ip
    healthCheckConfig:
      healthCheckProtocol: HTTPS
      healthCheckPath: /healthz
      healthCheckPort: traffic-port
      matcher:
        httpCode: "200-399"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd #  message: Listener does not allow route attachment, namespace does not match between listener and route # see https://gateway-api.sigs.k8s.io/reference/api-spec/main/spec/#httpbackendref for more reference if cross namespace required 
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal-alb-gateway
      sectionName: https
      namespace: jerney # default is also same as HTTPRoute namespace (if Gateway is in different namespace, change it to match that)
  hostnames:
  - "argocd.devstuffs.com" # certificate is automatically discovered and provided by ACM entry in AWS account
  rules:
    - backendRefs:
        - name: argocd-server # this is the exact name of service on argocd installation
          port: 443
