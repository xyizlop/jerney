# --------------------------------------------------
# Load Balancer (Gateway API) Configuration
# --------------------------------------------------
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: aws-alb-gateway-class
  namespace: jerney
spec:
  controllerName: gateway.k8s.aws/alb
---
apiVersion: gateway.k8s.aws/v1
kind: LoadBalancerConfiguration
metadata:
  name: external-lb
  namespace: jerney
spec:
  scheme: internet-facing
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: alb-gateway
  namespace: jerney
spec:
  gatewayClassName: aws-alb-gateway-class
  infrastructure:
    parametersRef:
      kind: LoadBalancerConfiguration
      name: external-lb
      group: gateway.k8s.aws
  listeners:
    - name: https
      hostname: app.devstuffs.com
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jerney
  namespace: jerney
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: alb-gateway
      sectionName: https
  hostnames:
  - "app.devstuffs.com"
  rules:
    - backendRefs:
        - name: jerney-frontend
          port: 80
