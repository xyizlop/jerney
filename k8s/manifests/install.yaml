apiVersion: v1
kind: Namespace
metadata:
  name: jerney
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jerney
  namespace: jerney
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: jerney
  name: pod-reader
rules:
- apiGroups: [""] # "" indicates the core API group
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-pods-binding
  namespace: jerney
subjects:
- kind: ServiceAccount
  name: jerney # Must match the ServiceAccount name
  namespace: jerney
roleRef:
  kind: Role
  name: pod-reader # Must match the Role name
  apiGroup: rbac.authorization.k8s.io
---
# --------------------------------------------------
# Database (postgres) Configuration
# --------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: jerney-database-cm
  namespace: jerney
data:
  db_name: jerney_db
  db_host: jerney-database
  db_port: "5432"
  db_user: jerney_user
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: jerney-database-secret
  namespace: jerney
spec:
  encryptedData:
    db_password: 
  template:
    metadata:
      name: jerney-database-secret
      namespace: jerney
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    service: jerney-database
  name: jerney-database
  namespace: jerney
spec:
  replicas: 1
  selector:
    matchLabels:
      service: jerney-database
  serviceName: jerney-database
  template:
    metadata:
      labels:
        service: jerney-database
        app: jerney-database
    spec:
      serviceAccountName: jerney
      containers:
      - name: jerney-database
        image: postgres:16
        ports:
        - containerPort: 5432
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false # you are writing to database
          # you can't set this fase becasue it will return error: spec.containers{jerney-database}: Error: container has runAsNonRoot and image will run as root (pod: "jerney-database-0_jerney(baa5eb18-f2cf-4283-be4d-638eddfaf585)", container: jerney-database)
          runAsNonRoot: false
        readinessProbe:
          tcpSocket:
            port: 5432
          initialDelaySeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 5432
          initialDelaySeconds: 10
          timeoutSeconds: 5
        env:
          - name: POSTGRES_USER
            valueFrom:
              configMapKeyRef:
                name: jerney-database-cm
                key: db_user
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: jerney-database-secret
                key: db_password
          - name: POSTGRES_DB
            valueFrom:
              configMapKeyRef:
                name: jerney-database-cm
                key: db_name
        volumeMounts:
          - name: data
            mountPath: /var/lib/postgresql/data
        resources:
          limits:
            cpu: 200m
            memory: 100Mi
          requests:
            cpu: 100m
            memory: 50Mi
      restartPolicy: Always
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: standard 
        volumeMode: Filesystem
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: jerney-database
  namespace: jerney
spec:
  selector:
    app: jerney-database
  ports:
  - port: 5432
    targetPort: 5432
---
# --------------------------------------------------
# Backend Configuration
# --------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jerney-backend
  namespace: jerney
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jerney-backend
  template:
    metadata:
      labels:
        app: jerney-backend
        service: jerney-backend
    spec:
      serviceAccountName: jerney
      containers:
      - name: jerney-backend
        image: iamdoingdemo/jerney-backend:v1
        ports:
        - containerPort: 5000
        env:
          - name: DB_HOST
            valueFrom:
              configMapKeyRef:
                name: jerney-database-cm
                key: db_host
          - name: DB_PORT
            valueFrom:
              configMapKeyRef:
                name: jerney-database-cm
                key: db_port
          - name: DB_USER
            valueFrom:
              configMapKeyRef:
                name: jerney-database-cm
                key: db_user
          - name: DB_NAME
            valueFrom:
              configMapKeyRef:
                name: jerney-database-cm
                key: db_name
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: jerney-database-secret
                key: db_password
          - name: PORT
            value: "5000"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: jerney-backend
  namespace: jerney
spec:
  selector:
    app: jerney-backend
  ports:
  - port: 5000
    targetPort: 5000
---
# --------------------------------------------------
# Frontend Configuration
# --------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jerney-frontend
  namespace: jerney
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jerney-frontend
  template:
    metadata:
      labels:
        app: jerney-frontend
        service: jerney-frontend
    spec:
      serviceAccountName: jerney
      containers:
      - name: jerney-frontend
        image: iamdoingdemo/jerney-frontend:v1
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: jerney-frontend
  namespace: jerney
spec:
  selector:
    app: jerney-frontend
  ports:
  - port: 80
    targetPort: 80
---
# networkpolicy allow ingress to jerney-backend from jerney-frontend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jerney-backend-network-policy
  namespace: jerney
spec:
  podSelector:
    matchLabels:
      app: jerney-backend
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: jerney
    - podSelector:
        matchLabels:
          app: jerney-frontend
    ports:
    - port: 5000
      protocol: TCP
---
# networkpolicy allow ingress to jerney-database from jerney-backend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jerney-database-network-policy
  namespace: jerney
spec:
  podSelector:
    matchLabels:
      app: jerney-database
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: jerney
    - podSelector:
        matchLabels:
          app: jerney-backend
    ports:
    - port: 5432
      protocol: TCP